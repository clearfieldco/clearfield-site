[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# The sample comp sheet is no longer public. Send old links to the gated demo.
[[redirects]]
  from = "/sample.html"
  to = "/demo.html"
  status = 301

[[redirects]]
  from = "/sample"
  to = "/demo.html"
  status = 301

# Function source is not a page.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/thanks.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/demo-sent.html"
  [headers.values]
    X-Robots-Tag = "noindex"

# Private demo: reached only from the link we email. Kept out of search and the sitemap.
[[headers]]
  for = "/demo/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
