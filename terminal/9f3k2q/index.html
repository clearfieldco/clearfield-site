<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clearfield Terminal | Demo workspace</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#011543">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;600;700&amp;family=Libre+Franklin:wght@400;500;600;700&amp;display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F5F7FA;color:#17243A;font-family:'Libre Franklin',Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:#011543}
button{font-family:inherit;cursor:pointer}
.s{font-family:'Libre Caslon Text',Georgia,serif;font-weight:600;letter-spacing:-0.012em}
.n{font-variant-numeric:tabular-nums lining-nums}
.lb{font-size:11px;line-height:16px;letter-spacing:0.08em;text-transform:uppercase;font-weight:700;color:#536985}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:4px;font-weight:700;font-size:14px;text-decoration:none;border:0}
.btn-w{background:#FFFFFF;color:#011543}.btn-w:hover{background:#DCE4EF}
.btn-n{background:#011543;color:#FFFFFF}.btn-n:hover{background:#18345C;color:#FFFFFF}
:focus-visible{outline:2px solid #536985;outline-offset:2px}

/* Top bar */
.top{background:#011543;color:#FFFFFF;border-bottom:1px solid #18345C;position:sticky;top:0;z-index:30}
.topin{display:flex;align-items:center;gap:16px;padding:0 24px;height:60px}
.top img{height:20px;width:auto;display:block}
.tname{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#DCE4EF;border-left:1px solid #18345C;padding-left:14px}
.tmeta{margin-left:auto;font-size:12px;color:#DCE4EF}

/* Layout */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 60px)}
aside{background:#FFFFFF;border-right:1px solid #DCE4EF;padding:20px 0 32px;display:flex;flex-direction:column;gap:4px}
aside .lb{padding:14px 20px 6px}
.cohort{margin:0 20px 6px;padding:12px;border:1px solid #DCE4EF;border-radius:4px;background:#F5F7FA;font-size:12px;line-height:18px}
.cohort b{color:#011543;display:block;font-size:13px}
.nb{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;padding:9px 20px 9px 18px;font-size:13.5px;color:#536985}
.nb:hover{color:#011543;background:#F5F7FA}
.nb[aria-current="true"]{color:#011543;font-weight:700;background:#F5F7FA;border-left-color:#011543}
.nb .k{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:3px;background:#DCE4EF;color:#011543;font-size:11px;font-weight:700}
.nb[aria-current="true"] .k{background:#011543;color:#FFFFFF}
.cbtns{display:flex;gap:6px;padding:0 20px 4px}
.cb{flex:1;min-height:36px;border:1px solid #DCE4EF;border-radius:3px;background:#FFFFFF;color:#536985;font-size:12.5px;font-weight:600}
.cb[aria-pressed="true"]{background:#011543;border-color:#011543;color:#FFFFFF}
.aside-note{margin:auto 20px 0;padding-top:20px;font-size:11.5px;line-height:17px;color:#536985}

main{min-width:0;padding:24px 32px 120px}
.welcome{background:#011543;color:#DCE4EF;border-radius:6px;padding:18px 22px;display:flex;gap:20px;align-items:flex-start;margin-bottom:24px}
.welcome h2{margin:0 0 4px;color:#FFFFFF;font-size:19px}
.welcome p{margin:0;font-size:13.5px;line-height:21px;max-width:780px}
.welcome button{margin-left:auto;background:none;border:1px solid #536985;color:#DCE4EF;border-radius:3px;font-size:12px;padding:6px 10px;flex:0 0 auto}
.crumb{font-size:12px;color:#536985}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:6px 0 20px;flex-wrap:wrap}
.head h1{margin:2px 0 4px;font-size:32px;line-height:38px;color:#011543}
.head p{margin:0;color:#536985}
.tag{font-size:11px;letter-spacing:0.06em;text-transform:uppercase;font-weight:700;color:#011543;border:1px solid #DCE4EF;background:#FFFFFF;border-radius:3px;padding:6px 10px;white-space:nowrap}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.panel{background:#FFFFFF;border:1px solid #DCE4EF;border-radius:6px;padding:18px 20px;min-width:0}
.ptop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.ptop h2{margin:0;font-size:18px;line-height:24px;color:#011543}
.ptop span{font-size:11.5px;color:#536985}
.kpi label{display:block;font-size:12px;color:#536985}
.kpi strong{display:block;font-family:'Libre Caslon Text',Georgia,serif;font-weight:600;font-size:28px;line-height:36px;color:#011543;margin:4px 0 2px}
.kpi small{font-size:12px;color:#536985}
.pos{color:#276749 !important}.neg{color:#9B3B32 !important}
.gap{margin-top:16px}

table.t{width:100%;border-collapse:collapse}
.t th{font-size:10.5px;letter-spacing:0.07em;text-transform:uppercase;color:#536985;font-weight:700;text-align:right;padding:8px 10px;border-bottom:1px solid #DCE4EF;white-space:nowrap}
.t td{padding:8px 10px;border-bottom:1px solid #F5F7FA;text-align:right;white-space:nowrap}
.t th:first-child,.t td:first-child{text-align:left}
.t tr.sub td{font-weight:700;color:#011543;border-top:1px solid #DCE4EF;background:#F5F7FA}
.t tr.ind td:first-child{padding-left:24px}
.t td.na{color:#536985;font-style:italic}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.src{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border-radius:3px;font-size:10px;font-weight:700;margin-left:8px;vertical-align:1px;border:1px solid #DCE4EF;color:#536985;background:#FFFFFF;cursor:help}
.src.D{color:#011543;border-color:#011543}
.src.V{color:#FFFFFF;background:#276749;border-color:#276749}
.src.C{color:#536985;background:#F5F7FA}
.mini{display:inline-block;height:8px;background:#011543;border-radius:1px;vertical-align:middle}
.minibox{display:inline-block;width:120px;background:#F5F7FA;border-radius:1px;text-align:left}

.stack{display:flex;height:16px;border-radius:2px;overflow:hidden;margin:4px 0 14px}
.legend-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #F5F7FA;font-size:13.5px}
.legend-row i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:10px;vertical-align:-1px}
.note{font-size:12.5px;line-height:19px;color:#536985;margin-top:12px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px}
.facts label{display:block;font-size:12px;color:#536985}
.facts b{display:block;color:#011543;font-size:14px;margin-top:2px}
.ins{border-left:2px solid #011543;padding:2px 0 2px 14px;margin:0 0 16px}
.ins:last-child{margin-bottom:0}
.ins b{display:block;color:#011543;font-size:14px}
.ins p{margin:3px 0 0;font-size:13px;line-height:20px;color:#536985}
.ins.gapnote{border-left-color:#DCE4EF}
.hbar{display:grid;grid-template-columns:120px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.hbar .tr{background:#F5F7FA;height:10px;border-radius:1px}
.hbar .fi{background:#011543;height:10px;border-radius:1px}
.hbar .v{text-align:right;color:#011543;font-weight:600}

/* Your numbers */
.inp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.inp label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:#011543}
.inp .wrap{position:relative}
.inp .wrap span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#536985}
.inp input{width:100%;min-height:46px;border:1px solid #DCE4EF;border-radius:4px;padding:0 12px 0 24px;font-size:16px;font-family:inherit;color:#17243A}
.pos-row{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid #F5F7FA}
.pos-row .lbl{font-weight:600;color:#011543;font-size:13px}
.track{position:relative;height:30px}
.track .ax{position:absolute;left:0;right:0;top:14px;height:2px;background:#DCE4EF}
.track .rg{position:absolute;top:10px;height:10px;background:#DCE4EF;border-radius:2px}
.track .cm{position:absolute;top:6px;width:2px;height:18px;background:#536985}
.track .cm em{position:absolute;top:-13px;left:-4px;font-style:normal;font-size:9.5px;color:#536985;font-weight:700}
.track .you{position:absolute;top:5px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#011543;border:3px solid #FFFFFF;box-shadow:0 0 0 1px #011543}
.pos-row .val{text-align:right;font-weight:700;color:#011543}
.callout{background:#F5F7FA;border:1px solid #DCE4EF;border-radius:6px;padding:16px 18px;font-size:14px;line-height:22px}
.callout b{color:#011543}

/* Bottom CTA + footer */
.cta{position:fixed;left:220px;right:0;bottom:0;z-index:25;background:#FFFFFF;border-top:1px solid #DCE4EF;box-shadow:0 -8px 24px rgba(1,21,67,0.06)}
.ctain{display:flex;align-items:center;gap:20px;padding:12px 32px;flex-wrap:wrap}
.ctain p{margin:0;font-size:13.5px;color:#17243A;flex:1 1 320px}
.ctain p b{color:#011543}
.powered{margin-top:32px;border-top:1px solid #DCE4EF;padding-top:16px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12px;color:#536985}
.powered b{color:#011543;letter-spacing:0.06em;text-transform:uppercase;font-size:11px}
.srcleg{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.srcleg .src{margin-left:0;margin-right:4px}

[data-view]{display:none}
[data-view].on{display:block}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g2e{grid-template-columns:minmax(0,1fr)}.inp{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
.shell{grid-template-columns:minmax(0,1fr)}
aside{border-right:0;border-bottom:1px solid #DCE4EF;padding:12px 0 8px;position:sticky;top:52px;z-index:20;gap:6px}
aside .lb,.cohort,.aside-note,aside .hide-m{display:none}
.navrow{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 12px;gap:4px}
.navrow::-webkit-scrollbar{display:none}
.nb{width:auto;white-space:nowrap;border-left:0;border-bottom:2px solid transparent;padding:8px 10px;font-size:13px}
.nb[aria-current="true"]{border-bottom-color:#011543}
.nb .k{display:none}
.cbtns{padding:0 12px}
.topin{height:52px;padding:0 14px}
.tmeta{display:none}
.top .btn{min-height:36px;padding:0 12px;font-size:12.5px;margin-left:auto;white-space:nowrap}
main{padding:18px 14px 140px}
.head h1{font-size:25px;line-height:31px}
.cta{left:0}.ctain{padding:10px 14px;gap:10px}.ctain .btn{width:100%}
.ctain p{font-size:12.5px}
.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.t td,.t th{padding:7px 4px;font-size:13px}.t td:first-child{white-space:normal}.t tr.ind td:first-child{padding-left:12px}.verdict{font-size:11px}.tname,.top .btn{display:none !important}.cbtns .cb{font-size:13px}
.pos-row{grid-template-columns:minmax(0,1fr) 60px}.pos-row .track{grid-column:1 / -1;grid-row:2}
.welcome{flex-direction:column;gap:10px}.welcome button{margin-left:0}
.kpi strong{font-size:20px;line-height:28px}
}
@media (min-width:861px){.navrow{display:contents}}
.take{font-size:13.5px;line-height:20px;color:#17243A;margin-top:12px}
.kpi small{display:block;margin-top:2px}
.verdict{font-size:12px;font-weight:700}
</style>
</head>
<body>

<header class="top">
<div class="topin">
<a href="/" aria-label="Clearfield &amp; Co. home"><img src="/assets/clearfield-wordmark.png" alt="Clearfield &amp; Co."></a>
<span class="tname">Terminal</span>
<span class="tmeta">Demo · Example businesses</span>
<a class="btn btn-w" href="/#pricing">Get your comps</a>
</div>
</header>

<div class="shell">
<aside aria-label="Terminal navigation">
<div class="cohort"><b>Pet supplies</b>Online shops selling $50K to $100K a month</div>
<div class="lb" style="padding:4px 20px 6px">Business</div>
<div class="cbtns" role="group" aria-label="Choose a business">
<button class="cb" data-comp="A" aria-pressed="true">A</button>
<button class="cb" data-comp="B" aria-pressed="false">B</button>
<button class="cb" data-comp="C" aria-pressed="false">C</button>
</div>
<div class="navrow">
<button class="nb" data-go="overview">Overview</button>
<button class="nb" data-go="pl">Money in, money out</button>
<button class="nb" data-go="compare">Side by side</button>
<button class="nb" data-go="you">Try your numbers</button>
</div>
</aside>

<main id="main">
<div class="head">
<div>
<h1 class="s" id="title">Business A</h1>
<p id="subtitle"></p>
</div>
</div>

<section data-view="overview"></section>
<section data-view="pl"></section>
<section data-view="compare"></section>
<section data-view="you"></section>

<div class="powered"><span><b>Powered by Clearfield Intelligence</b></span></div>
</main>
</div>

<div class="cta">
<div class="ctain">
<p><b>Want to see businesses like yours?</b> Real ones from your niche, in 24 hours.</p>
<a class="btn btn-n" href="/#pricing">Get your comps</a>
</div>
</div>

<script>
(function(){
// Example data. Every number is dollars out of each $100 of sales.
var C={
A:{title:'Pet food, sold by subscription',sales:'$55K to $65K',
 pl:{gross:106.0,disc:6.0,product:28.4,ship:10.4,ads:16.4,payroll:11.0,proc:2.6,platform:0.6,software:0.9,rent:1.2,prof:1.4,other:4.8,addbacks:9.5},
 season:[93,89,95,97,100,98,95,98,103,107,115,110],
 facts:[['How they sell','Website, mostly subscriptions'],['In business','4 to 6 years'],['Customers who come back','58 out of 100'],['Owner works','15 to 20 hours a week']],
 notes:['Spends the least on ads and keeps the most. Customers reorder on their own.','Pays more for staff, and it shows: most customers come back.','One supplier makes most of the product. A price hike there would hurt.']},
B:{title:'Pet treats, sold through social media ads',sales:'$70K to $80K',
 pl:{gross:108.5,disc:8.5,product:33.5,ship:12.5,ads:27.5,payroll:6.2,proc:2.9,platform:1.8,software:1.2,rent:0.4,prof:1.6,other:3.3,addbacks:12.0},
 season:[84,82,90,94,99,96,94,97,104,112,128,120],
 facts:[['How they sell','Website, one-time orders'],['In business','2 to 3 years'],['Customers who come back','27 out of 100'],['Owner works','35 to 45 hours a week']],
 notes:['Sells the most but keeps the least. Ads eat $27.50 of every $100.','Sales spike in the holidays, mostly from discounts.','The owner does nearly everything.']},
C:{title:'Pet food, online and in local stores',sales:'$85K to $95K',
 pl:{gross:104.5,disc:4.5,product:31.0,ship:10.2,ads:21.0,payroll:9.4,proc:2.4,platform:1.1,software:1.1,rent:2.8,prof:1.0,other:2.4,addbacks:8.0},
 season:[96,94,98,99,101,100,99,100,101,103,106,103],
 facts:[['How they sell','Website plus 140 pet stores'],['In business','6 to 8 years'],['Customers who come back','44 out of 100'],['Owner works','20 to 25 hours a week']],
 notes:['Selling to stores keeps sales steady all year.','Pays rent for its own warehouse instead of a shipping company.','No single cost is out of line.']}
};
function calc(p){var cogs=p.product+p.ship,gp=100-cogs,fees=p.proc+p.platform+p.software,opex=p.ads+p.payroll+fees+p.rent+p.prof+p.other,net=gp-opex;return {cogs:cogs,gp:gp,fees:fees,net:net,home:net+p.addbacks};}
['A','B','C'].forEach(function(k){C[k].x=calc(C[k].pl);});
function med(a){a=a.slice().sort(function(x,y){return x-y;});return a[1];}
function d2(n){return (n<0?'-':'')+'$'+Math.abs(n).toFixed(2);}
function d0(n){return '$'+Math.round(n);}
var $=function(q){return document.querySelector(q);};
var comp='A',view='overview';
var MON=['January','February','March','April','May','June','July','August','September','October','November','December'];

function kpis(c){
 function k(l,v,sm,cls){return '<div class="panel kpi"><label>'+l+'</label><strong class="n '+(cls||'')+'">'+v+'</strong><small>'+sm+'</small></div>';}
 return '<div class="grid g4">'+k('Sales each month',c.sales,'Before any costs')+
 k('Profit',d0(c.x.net),'kept from every $100 of sales',c.x.net>=15?'pos':c.x.net<10?'neg':'')+
 k('Making and shipping',d0(c.x.cogs),'of every $100 goes to product')+
 k('Ads',d0(c.pl.ads),'of every $100 goes to ads')+'</div>';
}
function seasonChart(s){
 var W=560,H=180,L=10,R=10,T=12,B=24,min=75,max=130;
 function x(i){return L+i*(W-L-R)/11;} function y(v){return T+(max-v)*(H-T-B)/(max-min);}
 var pts=s.map(function(v,i){return x(i).toFixed(1)+','+y(v).toFixed(1);}).join(' ');
 var lab=MON.map(function(t,i){return '<text x="'+x(i)+'" y="'+(H-4)+'" text-anchor="middle" font-size="11" fill="#536985">'+t[0]+'</text>';}).join('');
 return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="Sales by month">'+lab+
 '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(100)+'" y2="'+y(100)+'" stroke="#DCE4EF" stroke-dasharray="3 3"/>'+
 '<polygon points="'+x(0)+','+y(min)+' '+pts+' '+x(11)+','+y(min)+'" fill="#011543" fill-opacity="0.06"/><polyline points="'+pts+'" fill="none" stroke="#011543" stroke-width="2" stroke-linejoin="round"/></svg>';
}
function dollar(c){
 var p=c.pl,x=c.x,parts=[['Making and shipping the product',x.cogs,'#536985'],['Ads',p.ads,'#18345C'],['Staff and helpers',p.payroll,'#7E91AA'],['Card fees and software',x.fees,'#A7B6CA'],['Rent and other bills',p.rent+p.prof+p.other,'#DCE4EF'],['Profit',x.net,'#276749']];
 return '<div class="stack" role="img" aria-label="Where every 100 dollars of sales goes">'+parts.map(function(q){return '<div style="width:'+q[1]+'%;background:'+q[2]+'"></div>';}).join('')+'</div>'+
 parts.map(function(q){return '<div class="legend-row"><span><i style="background:'+q[2]+'"></i>'+q[0]+'</span><span class="n'+(q[0]==='Profit'?' pos':'')+'" style="font-weight:600">'+d2(q[1])+'</span></div>';}).join('');
}

function R(){
 var c=C[comp],profile=view==='overview'||view==='pl';
 document.querySelectorAll('.cb').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.comp===comp?'true':'false');b.disabled=!profile;b.style.opacity=profile?1:0.45;});
 document.querySelectorAll('.nb').forEach(function(b){b.setAttribute('aria-current',b.dataset.go===view?'true':'false');});
 document.querySelectorAll('[data-view]').forEach(function(s){s.classList.toggle('on',s.dataset.view===view);});
 if(profile){$('#title').textContent='Business '+comp+': '+c.title;$('#subtitle').textContent='Sells '+c.sales+' a month · Numbers from the past year';}
 var html='';
 if(view==='overview'){
  var pk=c.season.indexOf(Math.max.apply(null,c.season)),lo=c.season.indexOf(Math.min.apply(null,c.season));
  html=kpis(c)+'<div class="grid g2 gap"><div class="panel"><div class="ptop"><h2 class="s">Busy and slow months</h2></div>'+seasonChart(c.season)+
  '<div class="take">Busiest in '+MON[pk]+'. Slowest in '+MON[lo]+'.</div></div>'+
  '<div class="panel"><div class="ptop"><h2 class="s">Where every $100 of sales goes</h2></div>'+dollar(c)+'</div></div>'+
  '<div class="grid g2e gap"><div class="panel"><div class="facts">'+c.facts.map(function(f){return '<div><label>'+f[0]+'</label><b>'+f[1]+'</b></div>';}).join('')+'</div></div>'+
  '<div class="panel"><div class="ptop"><h2 class="s">What we noticed</h2></div>'+c.notes.map(function(i){return '<div class="ins"><p style="color:#17243A;margin:0">'+i+'</p></div>';}).join('')+'</div></div>';
 }
 if(view==='pl'){
  var p=c.pl,x=c.x;
  function m(fn){return med(['A','B','C'].map(function(k){return fn(C[k]);}));}
  // [label, value, row class, getter, higher is better? (1 yes, 0 no, null no verdict)]
  var rows=[
   ['Sales before discounts',p.gross,'',function(q){return q.pl.gross;},null],
   ['Discounts and refunds',-p.disc,'ind',function(q){return -q.pl.disc;},1],
   ['Sales',100,'sub',function(){return 100;},null],
   ['Making the product',-p.product,'ind',function(q){return -q.pl.product;},1],

function you(){
 function g(id){var v=parseFloat(String($('#y-'+id).value).replace(/[^0-9.]/g,''));return isFinite(v)?v:0;}
 var rev=g('rev'),out=$('#yout');
 if(rev<=0){out.innerHTML='';return;}
 var y={cogs:g('cogs')/rev*100,ads:g('ads')/rev*100,pay:g('pay')/rev*100};y.net=100-y.cogs-y.ads-y.pay-g('oth')/rev*100;
 var lines=[['Making and shipping','cogs',function(q){return q.x.cogs;},0],['Ads','ads',function(q){return q.pl.ads;},0],['Staff and helpers','pay',function(q){return q.pl.payroll;},null],['Profit','net',function(q){return q.x.net;},1]];
 var rows=lines.map(function(l){var cs=['A','B','C'].map(function(k){return l[2](C[k]);}),mn=Math.min.apply(null,cs),mx=Math.max.apply(null,cs),yv=y[l[1]];
  var lo=Math.min(mn,yv)-6,hi=Math.max(mx,yv)+6;function px(v){return Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100)).toFixed(1);}
  var tone=l[3]===null?'':(l[3]?(yv>=mx?'pos':yv<mn?'neg':''):(yv<=mn?'pos':yv>mx?'neg':''));
  return '<div class="pos-row"><span class="lbl">'+l[0]+'</span><div class="track" role="img" aria-label="'+l[0]+': you '+d2(yv)+' of every 100 dollars, the three businesses '+d2(mn)+' to '+d2(mx)+'"><div class="ax"></div><div class="rg" style="left:'+px(mn)+'%;width:'+(px(mx)-px(mn))+'%"></div>'+
  ['A','B','C'].map(function(k,i){return '<div class="cm" style="left:'+px(cs[i])+'%"><em>'+k+'</em></div>';}).join('')+'<div class="you" style="left:'+px(yv)+'%" title="You"></div></div><span class="val n '+tone+'">'+d2(yv)+'</span></div>';}).join('');
 var adsMed=med(['A','B','C'].map(function(k){return C[k].pl.ads;})),cogsMed=med(['A','B','C'].map(function(k){return C[k].x.cogs;}));
 var tot=Math.max(0,(y.ads-adsMed)/100*rev)+Math.max(0,(y.cogs-cogsMed)/100*rev);
 function usd(n){return '$'+Math.round(n).toLocaleString('en-US');}
 var msg='You keep <b>'+d2(y.net)+' of every $100</b> in sales. '+(tot>50?'If you spent like the typical business on ads and product, you’d keep about <b>'+usd(tot)+' more each month</b>.':'You already spend less than the typical business on ads and product.');
 out.innerHTML='<div class="panel gap"><div class="ptop"><h2 class="s">Out of every $100 in sales</h2><span>Dot = you · Lines = the three businesses</span></div>'+rows+'</div><div class="callout gap">'+msg+'</div>';
}
